<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Tab</title>
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin: 0;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: background-color 0.3s, color 0.3s;
  min-height: 100vh;
  box-sizing: border-box;
}

.triassic {
  background-color: #f4ecd8;
  color: #5c4033;
  background-image: radial-gradient(circle, rgba(92, 64, 51, 0.05) 1px, transparent 1px);
  background-size: 20px 20px;
}

.jurassic {
  background-color: #e6eed6;
  color: #2e4a22;
  background-image: radial-gradient(circle, rgba(46, 74, 34, 0.05) 1px, transparent 1px);
  background-size: 20px 20px;
}

.cretaceous {
  background-color: #dbe4e8;
  color: #1c3545;
  background-image: radial-gradient(circle, rgba(28, 53, 69, 0.05) 1px, transparent 1px);
  background-size: 20px 20px;
}

.top-bar {
  width: 100%;
  max-width: 600px;
  display: flex;
  justify-content: flex-end;
  margin-bottom: 20px;
}

select {
  padding: 5px 10px;
  font-size: 14px;
  border: 1px solid currentColor;
  border-radius: 4px;
  background: transparent;
  color: inherit;
  cursor: pointer;
}

.container {
  width: 100%;
  max-width: 600px;
  text-align: center;
}

h1 {
  font-size: 24px;
  font-weight: normal;
  margin: 0 0 10px 0;
}

#clock {
  font-size: 48px;
  margin: 10px 0;
}

#date {
  font-size: 16px;
  margin-bottom: 30px;
}

form {
  margin: 20px 0;
  display: flex;
  gap: 10px;
  justify-content: center;
}

input[type="text"], input[type="url"] {
  width: 70%;
  padding: 10px;
  font-size: 16px;
  border: 1px solid currentColor;
  border-radius: 4px;
  background: transparent;
  color: inherit;
}

button {
  padding: 10px 20px;
  font-size: 16px;
  cursor: pointer;
  background: transparent;
  color: inherit;
  border: 1px solid currentColor;
  border-radius: 4px;
}

button:hover {
  background: rgba(0, 0, 0, 0.05);
}

.bookmarks {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin: 20px 0;
}

.bookmark {
  padding: 5px 10px;
  border: 1px solid currentColor;
  text-decoration: none;
  color: inherit;
  border-radius: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.bookmark span {
  font-size: 12px;
  cursor: pointer;
  opacity: 0.6;
}

.bookmark span:hover {
  opacity: 1;
}

#add-bookmark-form input {
  width: auto;
  padding: 5px 10px;
}

#add-bookmark-form button {
  padding: 5px 10px;
}

.fact-tile {
  margin: 40px 0 20px 0;
  padding: 20px;
  border: 1px solid currentColor;
  border-radius: 4px;
  text-align: left;
}

.fact-tile h3 {
  margin: 0 0 10px 0;
  font-size: 16px;
}

.game-container {
  margin-top: 30px;
}

.game-container h3 {
  font-size: 16px;
  margin: 0 0 10px 0;
}

canvas {
  border: 1px solid currentColor;
  border-radius: 4px;
  background: transparent;
  cursor: pointer;
  display: block;
  margin: 0 auto;
}
</style>
</head>
<body class="jurassic">

<div class="top-bar">
  <select id="theme-select">
    <option value="triassic">Triassic Age</option>
    <option value="jurassic" selected>Jurassic Age</option>
    <option value="cretaceous">Cretaceous Age</option>
  </select>
</div>

<div class="container">
  <div style="margin-bottom: 20px;">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
      <path d="M2 13h2v2h2v-2h2v-2h2v-2h2V7h-2V5h4V3h4v4h-2v2h2v2h-2v12h-2v2h-2v-2h2v-4h-2v-2h-2v2h-2v2H8v-2H6v2H4v-2h2v-2H4v2H2v-4h2v-2H2v-2z"/>
    </svg>
  </div>
  
  <h1 id="greeting"></h1>
  <div id="clock"></div>
  <div id="date"></div>

  <form action="https://www.google.com/search" method="get">
    <input type="text" name="q" placeholder="Search the web..." autofocus autocomplete="off" required>
    <button type="submit">Search</button>
  </form>

  <div class="bookmarks" id="bookmarks-container"></div>
  
  <form id="add-bookmark-form">
    <input type="text" id="bm-name" placeholder="Name" required>
    <input type="url" id="bm-url" placeholder="URL" required>
    <button type="submit">Add</button>
  </form>

  <div class="fact-tile">
    <h3>Daily Dino Fact</h3>
    <div id="fact-text"></div>
  </div>

  <div class="game-container">
    <h3>Dino Run</h3>
    <canvas id="gameCanvas" width="600" height="150"></canvas>
  </div>
</div>

<script>
function updateTime() {
  const now = new Date();
  const hours = now.getHours();
  const minutes = now.getMinutes().toString().padStart(2, '0');
  
  document.getElementById('clock').textContent = `${hours}:${minutes}`;
  
  const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  document.getElementById('date').textContent = now.toLocaleDateString(undefined, options);

  let greeting = "Good evening";
  if (hours < 12) greeting = "Good morning";
  else if (hours < 18) greeting = "Good afternoon";
  
  document.getElementById('greeting').textContent = greeting;
}

setInterval(updateTime, 1000);
updateTime();

let bookmarks = JSON.parse(localStorage.getItem('dino_bookmarks')) || [
  { name: 'Google', url: 'https://google.com' },
  { name: 'YouTube', url: 'https://youtube.com' },
  { name: 'Gmail', url: 'https://mail.google.com' },
  { name: 'GitHub', url: 'https://github.com' }
];

function renderBookmarks() {
  const container = document.getElementById('bookmarks-container');
  container.innerHTML = '';
  
  bookmarks.forEach((bm, index) => {
    const a = document.createElement('a');
    a.href = bm.url;
    a.className = 'bookmark';
    a.textContent = bm.name;
    
    const del = document.createElement('span');
    del.textContent = '✕';
    del.onclick = (e) => {
      e.preventDefault();
      bookmarks.splice(index, 1);
      saveBookmarks();
    };
    
    a.appendChild(del);
    container.appendChild(a);
  });
}

function saveBookmarks() {
  localStorage.setItem('dino_bookmarks', JSON.stringify(bookmarks));
  renderBookmarks();
}

document.getElementById('add-bookmark-form').onsubmit = (e) => {
  e.preventDefault();
  const name = document.getElementById('bm-name').value;
  const url = document.getElementById('bm-url').value;
  
  bookmarks.push({ name, url });
  saveBookmarks();
  
  document.getElementById('bm-name').value = '';
  document.getElementById('bm-url').value = '';
};

renderBookmarks();

const facts = [
  "The Stegosaurus had a brain the size of a walnut.",
  "T-Rex teeth could be up to 12 inches long.",
  "Velociraptors were actually the size of a turkey.",
  "Pterodactyls are not technically dinosaurs, but flying reptiles.",
  "The Brachiosaurus could weigh up to 80 tons.",
  "Dinosaurs ruled the Earth for over 160 million years.",
  "Birds are the closest living relatives to dinosaurs.",
  "The word dinosaur comes from Greek, meaning 'terrible lizard'.",
  "Ankylosaurus had a club-like tail used for defense.",
  "Triceratops had almost 800 teeth that constantly replaced themselves."
];

const today = new Date();
const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
document.getElementById('fact-text').textContent = facts[dayOfYear % facts.length];

const themeSelect = document.getElementById('theme-select');
const savedTheme = localStorage.getItem('dino_theme') || 'jurassic';
document.body.className = savedTheme;
themeSelect.value = savedTheme;

themeSelect.onchange = (e) => {
  document.body.className = e.target.value;
  localStorage.setItem('dino_theme', e.target.value);
  if (!gameActive) drawInitialCanvas();
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let dino = { x: 50, y: 110, w: 20, h: 20, dy: 0, gravity: 0.6, jumpPower: -10, grounded: false };
let obstacles = [];
let gameActive = false;
let score = 0;
let frameCount = 0;
let animationId;

function drawInitialCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = getComputedStyle(document.body).color;
  ctx.font = "16px sans-serif";
  ctx.fillText("Click here or press Space to start", 180, 75);
  
  ctx.beginPath();
  ctx.moveTo(0, 130);
  ctx.lineTo(600, 130);
  ctx.strokeStyle = getComputedStyle(document.body).color;
  ctx.stroke();
}

function resetGame() {
  dino.y = 110;
  dino.dy = 0;
  obstacles = [];
  score = 0;
  frameCount = 0;
  gameActive = true;
  gameLoop();
}

function gameLoop() {
  if (!gameActive) return;
  
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = getComputedStyle(document.body).color;
  ctx.strokeStyle = getComputedStyle(document.body).color;

  ctx.beginPath();
  ctx.moveTo(0, 130);
  ctx.lineTo(600, 130);
  ctx.stroke();

  dino.dy += dino.gravity;
  dino.y += dino.dy;
  
  if (dino.y + dino.h >= 130) {
    dino.y = 130 - dino.h;
    dino.dy = 0;
    dino.grounded = true;
  } else {
    dino.grounded = false;
  }
  
  ctx.fillRect(dino.x, dino.y, dino.w, dino.h);

  if (frameCount % 90 === 0) {
    obstacles.push({ x: canvas.width, y: 110, w: 15, h: 20 });
  }

  for (let i = 0; i < obstacles.length; i++) {
    let obs = obstacles[i];
    obs.x -= 5;
    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);

    if (
      dino.x < obs.x + obs.w &&
      dino.x + dino.w > obs.x &&
      dino.y < obs.y + obs.h &&
      dino.y + dino.h > obs.y
    ) {
      gameActive = false;
      ctx.fillText("Game Over - Click to Restart", 200, 75);
    }
  }

  obstacles = obstacles.filter(o => o.x + o.w > 0);

  ctx.font = "14px sans-serif";
  ctx.fillText("Score: " + Math.floor(score), 10, 20);
  
  score += 0.1;
  frameCount++;

  if (gameActive) {
    animationId = requestAnimationFrame(gameLoop);
  }
}

function jump(e) {
  if (e.type === 'keydown' && e.code !== 'Space') return;
  if (e.type === 'keydown' && e.target.tagName === 'INPUT') return;
  
  if (e.code === 'Space') e.preventDefault();
  
  if (!gameActive) {
    resetGame();
  } else if (dino.grounded) {
    dino.dy = dino.jumpPower;
  }
}

window.addEventListener('keydown', jump);
canvas.addEventListener('mousedown', jump);

drawInitialCanvas();
</script>
</body>
</html>
